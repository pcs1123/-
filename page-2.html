<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1324" />
  <title>檔案 002｜秘密通訊</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 30px 18px; color: #f4eaff; font-family: system-ui,-apple-system,"Noto Sans TC",sans-serif; background: radial-gradient(circle at 60% 20%,#423050,#0d1023 65%); }
    article { width: min(100%, 660px); border: 1px solid #b48fb16c; border-radius: 22px; padding: clamp(25px,6vw,55px); background: #ffffff0c; box-shadow: 0 25px 65px #03071175; }
    .tag { color: #f4cbe9; letter-spacing: .26em; font-size: 11px; font-family: monospace; }
    h1 { margin: 18px 0; font-size: clamp(30px, 7vw, 47px); letter-spacing: .12em; }
    .line { width: 48px; height: 2px; background: #ffd5eb; margin: 25px 0; }
    p { line-height: 2; color: #ead8ec; }
    a { display: inline-block; margin-top: 18px; padding: 12px 17px; border-radius: 12px; color: #3b2543; text-decoration: none; background: #f6d6ed; font-weight: 700; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <article>
    <p class="tag">SECRET FILE · 002</p>
    <h1>星光留言</h1>
    <div class="line"></div>
    <p>星星已收到你的訊號。</p>
    <p>這裡是第二個示範頁面。輸入 STAR 就會來到這裡。你可以替換成角色檔案、隱藏日記、設定資料庫或作品目錄。</p>

  </article>
</body>
</html>
