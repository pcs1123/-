<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e8e1e5">
<title>kazami★彡 · Flip Phone</title>
<style>
:root{
  --pink:#e6dde2;--pink-high:#f7f2f4;--pink-dark:#c7b8c1;
  --pink-shadow:#b19fa8;--ink:#7c6c76;--key:#f2eaee;
  --screen-h:384px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 15%,#fffefd,#f8f1f3 48%,#eee6ec 100%);color:#765369;font-family:Arial,"Hiragino Kaku Gothic ProN","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid #ad4e7f;outline-offset:3px}
button:active{filter:brightness(.95)}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 10px 28px}
.scene{width:288px;max-width:calc(100vw - 24px);position:relative;perspective:1800px;transition:height 1.85s cubic-bezier(.22,.61,.2,1);height:603px;flex:none}
.scene.is-open{height:1080px}
/* A single moving hinge: both faces share exactly the same axis. */
.flip{position:absolute;left:0;top:-460px;width:100%;height:460px;z-index:8;transform-origin:50% 100%;transform:rotateX(-180deg);transform-style:preserve-3d;transition:top 1.85s cubic-bezier(.22,.61,.2,1),transform 1.85s cubic-bezier(.22,.61,.2,1);will-change:transform,top}
.scene.is-open .flip{top:17px;transform:rotateX(0deg)}
.lid{position:absolute;inset:0;width:100%;height:460px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(1px);pointer-events:auto}
.scene:not(.is-open) .lid{pointer-events:none}

.lid-shell,.base,.cover{
  background:linear-gradient(100deg, #c98da2 0%,#ebbac9 7%,#edb8c9 44%,#e5adbf 79%,#c994aa 100%);
  border:1.5px solid #b77e94;
  box-shadow:inset 2px 2px 3px rgba(255,242,245,.85),inset -3px -2px 5px rgba(123,66,92,.19),0 10px 20px rgba(81,42,61,.17);
}
.lid-shell{width:100%;height:460px;border-radius:31px 31px 12px 12px;position:relative;padding:29px 15px 14px}
.speaker{width:41px;height:6px;border-radius:20px;margin:0 auto 24px;background:#382b36;border:1px solid #bd8ca0;box-shadow:inset 0 1px 2px #110e11,0 1px 0 #ffe4e7}
.lcd-bezel{height:365px;padding:4px;background:#19181a;border:1.5px solid #6b4259;border-radius:5px;box-shadow:0 2px 2px rgba(75,43,52,.25),inset 0 0 0 1px #2b242d}
.screen{height:var(--screen-h);position:relative;overflow:hidden;border-radius:1px;color:#fff;isolation:isolate;background:#e4bcd0}
.screen-wallpaper{position:absolute;inset:0;z-index:-2;background:linear-gradient(155deg,#f9e8ef 0%,#eeb9cd 39%,#c59db9 100%);background-position:center;background-size:cover;transition:background-image .15s}
.default-decor{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 70% 25%,rgba(255,255,255,.72),transparent 24%),radial-gradient(circle at 28% 54%,rgba(255,239,244,.8),transparent 23%),linear-gradient(145deg,transparent,rgba(113,58,101,.16))}
.default-decor::before{content:"✧";position:absolute;left:19px;top:65px;font-size:94px;color:rgba(255,255,255,.5)}
.default-decor::after{content:"♡";position:absolute;right:12px;bottom:69px;font-size:109px;color:rgba(255,255,255,.37)}
.screen.has-wallpaper .default-decor{display:none}
.screen::after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;background:linear-gradient(110deg,rgba(255,255,255,.13),transparent 38%,rgba(0,0,0,.035) 90%)}
.status{position:absolute;top:0;left:0;right:0;height:23px;display:flex;align-items:center;justify-content:space-between;padding:2px 7px;color:#fff;font-size:10px;letter-spacing:.01em;text-shadow:0 1px 3px #6c5b6e;background:linear-gradient(180deg,rgba(45,35,53,.21),transparent);z-index:4}
.signal{font-size:10px;font-weight:bold}
.screen-content{position:absolute;inset:23px 0 32px;overflow:auto;z-index:2;scrollbar-width:thin;scrollbar-color:#d7b1c5 transparent}
.screen-footer{position:absolute;bottom:0;height:32px;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:rgba(69,42,62,.49);backdrop-filter:blur(4px);color:white;font-size:10px;font-weight:600}
.soft-button{background:none;border:0;color:inherit;padding:8px 2px;min-width:34px;font-size:10px;font-weight:700}
.lid-camera{position:absolute;right:19px;bottom:7px;width:7px;height:7px;border-radius:50%;border:2px solid #c18a9e;background:#633e59;box-shadow:0 1px 0 #ffdae3}
.hinge{position:absolute;top:463px;left:0;right:0;height:27px;z-index:10;display:flex;align-items:center;pointer-events:none;transition:top 1.85s cubic-bezier(.22,.61,.2,1)}
.hinge::before,.hinge::after{content:"";width:24%;height:26px;border:1px solid #bc879b;background:linear-gradient(#eec4d0,#b47c92 45%,#f2c0d1 85%,#aa6f86);border-radius:10px;box-shadow:inset 0 2px 2px #f8d6de}
.hinge span{flex:1;height:29px;border:1px solid #ad708b;border-radius:8px;background:linear-gradient(180deg,#d49bad,#f9d3dd 20%,#cc92a6 56%,#eeb7c8 84%,#a96985 100%);box-shadow:inset 0 1px 3px rgba(255,255,255,.8)}
.scene:not(.is-open) .hinge{top:-14px}
.base{position:absolute;top:0;left:0;width:100%;height:603px;border-radius:13px 13px 31px 31px;padding:35px 22px 16px;transition:top 1.85s cubic-bezier(.22,.61,.2,1);z-index:3;overflow:hidden}
.scene.is-open .base{top:477px}
.brand-name{text-align:center;color:#7f3b5a;font-size:15px;font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.025em;text-shadow:0 1px 0 #ffdfeb;height:28px}
.brand-name b{font-size:15px}
.control-area{display:grid;grid-template-columns:43px 1fr 43px;gap:7px;align-items:center;margin:8px 0 10px}
.side-controls{display:flex;flex-direction:column;gap:14px;align-items:center}
.circle-utility{width:40px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #c18ba0;border-radius:50%;background:linear-gradient(145deg,#f7d9e0,#e8acbf);box-shadow:inset 1px 2px 2px #fff0f3,0 2px 2px #bd859b;color:#87435f;padding:0}
.circle-utility svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.circle-utility .mini-jp{font-size:8px;letter-spacing:-.06em;white-space:nowrap;font-weight:700}
.round-pad{width:118px;height:118px;border-radius:50%;position:relative;margin:auto;background:linear-gradient(145deg,#f5c8d7,#cf91a8);border:2px solid #c18ba0;box-shadow:inset 2px 2px 3px rgba(255,247,249,.9),0 2px 3px rgba(109,66,84,.22)}
.round-pad button{position:absolute;border:0;background:transparent;color:#84405e;padding:0}
.arrow-up{top:3px;left:43px;width:28px;height:25px;font-size:17px}
.arrow-down{bottom:3px;left:43px;width:28px;height:25px;font-size:17px}
.arrow-left{top:43px;left:0;width:28px;height:28px;font-size:18px}
.arrow-right{top:43px;right:0;width:28px;height:28px;font-size:18px}
.round-pad .circle-ok{left:33px;top:33px;width:48px;height:48px;border-radius:50%;border:1.5px solid #a96e8a;background:radial-gradient(circle at 39% 32%,#a46a83,#89516d 75%);box-shadow:inset 1px 2px 4px rgba(62,37,56,.37),0 1px 1px #ffe1ec;font-size:0}
.command-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:0 0 9px}
.command{height:34px;border-radius:6px;border:1px solid #c38c9e;background:linear-gradient(#f7d5de,#e9b7c8);color:#7e3e5a;box-shadow:inset 0 1px 1px #fff4f6,0 1px 2px rgba(149,82,117,.16);display:flex;align-items:center;justify-content:center;gap:3px;padding:0 2px;font-size:12px;font-weight:bold}
.command svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.command small{font-size:8px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px 8px}
.number-key{height:47px;min-width:0;border:1px solid #d5a2b4;border-radius:5px;background:linear-gradient(155deg,#ffdee8 0%,#f2c1d0 66%,#e9adbf 100%);color:#4d3445;box-shadow:inset 0 1px 1px #fff5f8,0 1px 2px rgba(120,70,94,.16);display:flex;align-items:center;justify-content:center;gap:2px;padding:2px 3px;text-shadow:0 1px 0 #fff2f5}
.number-key .num{font-family:Arial,sans-serif;font-size:28px;font-weight:400;line-height:1}
.number-key .key-sub{display:flex;flex-direction:column;gap:1px;align-items:flex-start;min-width:0}
.number-key .kana{font-size:10px;white-space:nowrap;line-height:1.05}
.number-key .letters{font-size:7px;white-space:nowrap;line-height:1}
.number-key[data-key="*"] .num,.number-key[data-key="#"] .num{font-size:29px}
.speedrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 0}
.speedkey{height:30px;border-radius:4px;border:1px solid #d5a1b6;background:linear-gradient(#f6cbd7,#e8b0c2);box-shadow:inset 0 1px 1px #fff6f8;color:#7f4861;font:18px Georgia,serif}
.bottom-label{display:flex;justify-content:space-between;font-size:8px;color:#a36e84;padding:17px 3px 0}
.mic{width:3px;height:3px;border-radius:50%;background:#83516b;position:absolute;bottom:16px;left:50%}
.cover{position:absolute;top:100%;left:0;width:100%;height:603px;border-radius:27px 27px 32px 32px;transform-origin:50% 0;transform:rotateX(180deg) translateZ(1px);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:0;pointer-events:auto}
.scene.is-open .cover{pointer-events:none}
.cover::before{content:"";position:absolute;inset:32px 12px 15px;border:1px solid rgba(255,235,241,.38);border-radius:22px 22px 30px 30px;pointer-events:none}
.cover-title{position:absolute;top:68px;left:0;width:100%;font-family:Georgia,serif;text-align:center;font-size:19px;color:#a56a80;letter-spacing:-.01em}
.cover-gloss{position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.2) 26%,transparent 45%);pointer-events:none}
.cover-display{position:absolute;top:207px;left:50%;transform:translateX(-50%);width:61px;height:210px;border:2px solid #b07b95;background:linear-gradient(180deg,#bb8ca5,#996e88);border-radius:6px;box-shadow:inset 0 1px 6px rgba(60,39,66,.3),0 1px 1px rgba(255,238,245,.75);color:#ffe7f3;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.cover-time{font-family:Arial,sans-serif;font-size:28px;letter-spacing:.05em;writing-mode:vertical-rl;text-orientation:mixed;font-weight:300}
.cover-hint{position:absolute;bottom:65px;left:0;width:100%;text-align:center;color:#85415f;font-size:11px;letter-spacing:.1em;animation:pulse 2s infinite}
.cover-hint span{display:block;margin-bottom:7px;font-size:19px}
@keyframes pulse{50%{opacity:.45}}
.hang-charm{position:absolute;left:-38px;top:46px;width:40px;height:123px;z-index:15;pointer-events:none;transition:top 1.85s cubic-bezier(.22,.61,.2,1)}
.scene.is-open .hang-charm{top:523px}
.hang-charm:before{content:"";position:absolute;top:0;left:31px;width:22px;height:78px;border-left:2px solid #d5bba1;border-radius:50% 0 0 50%;transform:rotate(11deg)}
.hang-charm:after{content:"☆";position:absolute;top:73px;left:5px;font-size:37px;color:#f3d5b5;text-shadow:0 1px 2px #bba68c}
/* screen states */
.lock-screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px 5px;text-shadow:0 2px 4px rgba(62,39,72,.36)}
.lock-date{font-size:12px;letter-spacing:.08em}
.lock-time{font-family:Arial,sans-serif;font-weight:200;letter-spacing:.02em;font-size:57px;line-height:1.2;margin:6px 0 24px}
.lock-label{font-size:11px;letter-spacing:.12em;margin-bottom:5px;font-weight:700}
.lock-input{width:100%;height:38px;border:1px solid rgba(255,255,255,.75);border-radius:5px;background:rgba(52,29,59,.31);box-shadow:0 0 0 1px rgba(76,49,63,.2);color:white;text-align:center;font-size:22px;letter-spacing:.12em;outline:none}
.lock-input::placeholder{color:#fff;opacity:.75;letter-spacing:.1em}
.lock-help{margin:8px 0 0;text-align:center;font-size:11px;line-height:1.5;min-height:36px;max-width:224px}
.home-screen{min-height:100%;padding:18px 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-shadow:0 1px 5px rgba(70,40,63,.38)}
.home-time{font-size:43px;font-weight:200;line-height:1.1;letter-spacing:.01em;margin:2px 0 0}
.home-date{font-size:11px;margin-top:2px;letter-spacing:.03em}
.home-owner{font-size:11px;font-weight:bold;letter-spacing:.04em;background:rgba(72,42,63,.28);border-radius:999px;padding:4px 9px;margin-top:9px}
.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);width:100%;gap:16px 3px;padding:14px 2px 13px;background:linear-gradient(0deg,rgba(43,30,49,.23),rgba(43,30,49,.09));border-radius:9px}
.app-icon{border:0;background:transparent;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 1px;min-width:0;text-shadow:0 1px 3px #544055}
.app-icon .icon-square{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.8);box-shadow:0 2px 4px rgba(83,50,76,.26),inset 0 1px 1px #fff;background:linear-gradient(135deg,#fce3e9,#eeb3c6);color:#994e77;font-size:25px;text-shadow:none}
.app-icon .icon-square svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-icon .app-label{display:none}
.panel-title .heading-icon{display:grid;place-items:center;width:25px;height:25px;flex:none}
.panel-title .heading-icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-icon.selected .icon-square{outline:2px solid white;outline-offset:2px}
.panel{min-height:100%;padding:10px 13px 16px;color:#5c3650;text-shadow:none;background:rgba(255,247,250,.83);border-radius:0}
.panel-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:5px 0 12px;line-height:1.2}
.panel-title .heading-icon{font-size:23px}
.panel-body{font-size:12px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.panel-card{border:1px solid #edbfd0;border-radius:9px;padding:12px 10px;background:rgba(255,255,255,.64);margin-bottom:9px}
.panel-caption{font-size:10px;color:#ad6b92;letter-spacing:.07em;margin:0 0 5px;font-weight:bold}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.action{border:1px solid #bc829e;border-radius:7px;background:#e6aac1;color:#713855;font-size:11px;font-weight:bold;padding:9px 11px}
.action.alt{background:#fff3f7}
.wallpaper-tip{font-size:11px;line-height:1.6;color:#95647e;margin-top:12px}
.gallery-thumb{width:100%;height:104px;border-radius:9px;background:linear-gradient(130deg,#ecc4d5,#ddafc7);background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-size:30px;text-shadow:0 2px 3px #9c7691}
/* 底部三個螢幕快捷 App；與實體 I、II、III 一一對應 */
.screen.unlocked .screen-content{bottom:58px}
.screen.unlocked .screen-footer{display:none}
.screen-dock{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:9px;width:168px;height:40px;z-index:5;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 10px;background:linear-gradient(180deg,rgba(67,44,72,.46),rgba(53,35,58,.38));backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.33);border-radius:999px;box-shadow:0 6px 16px rgba(48,26,49,.22), inset 0 1px 0 rgba(255,255,255,.28)}
.screen.unlocked .screen-dock{display:grid}
.dock-app{border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;min-width:0;padding:0;border-radius:999px}
.dock-app .dock-graphic{display:grid;place-items:center;width:26px;height:26px;border:1px solid rgba(255,255,255,.88);border-radius:999px;background:linear-gradient(145deg,#fff1f6,#efbfd1);color:#985477;box-shadow:0 3px 8px rgba(54,32,58,.22), inset 0 1px 0 rgba(255,255,255,.95)}
.dock-app svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock-app.selected .dock-graphic{outline:1.5px solid rgba(255,255,255,.92);outline-offset:2px;transform:translateY(-1px)}
.album-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:9px 0}
.album-choice{position:relative;min-width:0;border:2px solid #edc4d5;border-radius:9px;background:#fff9fb;padding:4px;text-align:left;color:#7b4a64;box-shadow:0 1px 3px rgba(60,22,40,.09)}
.album-choice.active{border-color:#ae5681;box-shadow:0 0 0 1px #ae5681}
.album-choice img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:linear-gradient(140deg,#f2d3e1,#d0a5c6);border-radius:5px}
.album-choice span{display:block;font-size:10px;text-align:center;padding:4px 0 1px}
.album-choice .selected-mark{position:absolute;top:7px;right:7px;width:23px;height:23px;border-radius:50%;background:#9e4e78;color:white;display:grid;place-items:center;font-size:14px;font-weight:bold}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px;font-size:13px;font-weight:bold}
.calendar-head button{width:30px;height:28px;border:1px solid #d9abc0;border-radius:5px;color:#854761;background:#fff4f8}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}

.under-note{margin-top:14px;max-width:295px;color:#a07087;font-size:11px;text-align:center;line-height:1.7}

.lid-shell{padding:17px 14px 12px}

function searchKeyPress(key){if(state.app!=='home'||state.searchMode==='idle'||state.searchQuery.length>=36)return;if(key==='#'&&state.mode!==0){resetSearchTap();showSearchStatus('已確認目前文字');return}if(key==='*'&&(state.mode===2||state.mode===3)){const variants={'か':'が','さ':'ざ','た':'だ','は':'ば','ば':'ぱ','つ':'っ','や':'ゃ','ゆ':'ゅ','よ':'ょ'};const end=state.searchQuery.slice(-1);if(variants[end])state.searchQuery=state.searchQuery.slice(0,-1)+variants[end];resetSearchTap();syncSearchInput();return}const group=state.mode===1?latin[key]:(state.mode===2||state.mode===3)?kana[key]:null;if(group){const now=Date.now();if(state.searchLastKey===key&&now-state.searchLastAt<1150&&state.searchQuery.length){state.searchLetterIndex=(state.searchLetterIndex+1)%group.length;const ch=group[state.searchLetterIndex];state.searchQuery=state.searchQuery.slice(0,-1)+(state.mode===3?toKatakana(ch):ch)}else{state.searchLetterIndex=0;state.searchQuery+=(state.mode===3?toKatakana(group[0]):group[0])}state.searchLastKey=key;state.searchLastAt=now}else{state.searchQuery+=key==='0'&&state.mode===1?' ':key;resetSearchTap()}syncSearchInput();showSearchStatus('按中央圓形鍵確認暗號')}

function allPhotos(){return ALBUMS.flatMap(album=>album.photos)}

 const available=allPhotos().map(photo=>photo.file);
 const safeFile=available.includes(file)?file:available[0];

 $('screenWallpaper').style.backgroundImage='url("'+encodeURI(safeFile).replace(/"/g,'%22')+'")';

}

 const apply=el('button','photo-wallpaper-btn',state.wallpaperFile===photo.file?'✓ 目前使用這張桌布':'♡ 設為桌布');

  applyWallpaper(photo.file);
  apply.textContent='✓ 已設為桌布';
  note('已把「'+photo.title+'」設為桌布！');
 });
 actionArea.append(apply);p.append(actionArea);
 content.scrollTop=0;selectNav(p.querySelector('.panel-back'));
 note('點擊底部「設為桌布」，只會變更你自己的手機畫面。');
}
function openCalendar(){const p=panel('日曆','calendar');const head=el('div','calendar-head');const prev=el('button','','‹');prev.type='button';prev.setAttribute('aria-label','上一個月');const monthTitle=el('span','','');const next=el('button','','›');next.type='button';next.setAttribute('aria-label','下一個月');head.append(prev,monthTitle,next);p.append(head);const grid=el('div','calendar-grid');p.append(grid);const info=el('div','calendar-note');p.append(info);function draw(){grid.replaceChildren();monthTitle.textContent=state.year+'年 '+String(state.month+1).padStart(2,'0')+'月';for(const d of ['日','一','二','三','四','五','六'])grid.append(el('span','weekday',d));const offset=new Date(state.year,state.month,1).getDay();for(let j=0;j<offset;j++)grid.append(el('span','blank'));const max=new Date(state.year,state.month+1,0).getDate();const today=new Date();for(let day=1;day<=max;day++){const isToday=today.getFullYear()===state.year&&today.getMonth()===state.month&&today.getDate()===day;const b=el('button',(isToday?'today ':'')+(day===state.pickedDay?'picked':''),String(day));b.type='button';b.addEventListener('click',()=>{state.pickedDay=day;draw()});grid.append(b)}info.textContent='已選擇：'+state.year+' / '+String(state.month+1).padStart(2,'0')+' / '+String(state.pickedDay).padStart(2,'0')}prev.onclick=()=>{const d=new Date(state.year,state.month-1,1);state.year=d.getFullYear();state.month=d.getMonth();state.pickedDay=1;draw()};next.onclick=()=>{const d=new Date(state.year,state.month+1,1);state.year=d.getFullYear();state.month=d.getMonth();state.pickedDay=1;draw()};draw()}
function openApp(id){if(!state.open||!state.unlocked)return;state.app=id;let p;if(id==='contacts'){p=panel('通訊錄','contacts');addCard(p,'CONTACTS',CONTACTS_TEXT)}else if(id==='memo'){p=panel('備忘錄','memo');addCard(p,'MEMO',MEMO_TEXT)}else if(id==='messages'){p=panel('訊息','messages');addCard(p,'INBOX',MESSAGE_TEXT)}else if(id==='photos'){openPhotos()}else if(id==='calendar'){openCalendar()}else renderHome();content.scrollTop=0;if(id!=='photos'){note('方向鍵移動選取框、中央圓鍵確認；上下鍵也可捲動。');selectNav(content.querySelector('button'))}}
function resetTap(){state.lastKey='';state.lastAt=0;state.letterIndex=0}
function lockPhone(){state.unlocked=false;state.code='';state.mode=0;resetTap();renderLock()}
function openPhone(){if(state.open)return;state.open=true;scene.classList.add('is-open');$('cover').setAttribute('aria-hidden','true');$('base').inert=false;$('lid').inert=false;renderLock()}
function closePhone(){if(!state.open)return;lockPhone();state.open=false;scene.classList.remove('is-open');$('cover').removeAttribute('aria-hidden');
$('base').inert=true;$('lid').inert=true;note('點擊合蓋手機的外螢幕，翻開這支手機 ✧')}
function unlock(){if(!state.open)return;if(state.unlocked){activateSelection();return}const v=(($('passwordInput')||{}).value||state.code).trim();state.code=v;if(!v){syncCode('請先輸入密碼');return}if(v!==PASSWORD){syncCode('密碼不正確，請再試一次');return}state.unlocked=true;state.selected=0;renderHome()}
function back(){if(!state.open)return;if(state.unlocked){if(state.app==='photo-detail'){openAlbum(state.activeAlbum);return}if(state.app==='album'){openPhotos();return}if(state.app!=='home'){renderHome();return}if(state.searchMode!=='idle'){state.searchQuery=state.searchQuery.slice(0,-1);resetSearchTap();syncSearchInput();showSearchStatus('已刪除最後一個字');return}lockPhone()}else{state.code=state.code.slice(0,-1);resetTap();syncCode()}}
function toKatakana(t){return t.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96))}
function keyPress(key){if(!state.open)return;if(state.unlocked){if(state.app==='home'&&state.searchMode!=='idle'){searchKeyPress(key);return}if('12345'.includes(key)){const a=APP_LIST[Number(key)-1];if(a)openApp(a.id)}else if(key==='0')renderHome();return}if(key==='#'&&state.mode!==0){resetTap();syncCode('已確定目前文字');return}if(key==='*'&&(state.mode===2||state.mode===3)){const alternates={'か':'が','さ':'ざ','た':'だ','は':'ば','ば':'ぱ','つ':'っ','や':'ゃ','ゆ':'ゅ','よ':'ょ'};const ch=state.code.slice(-1);if(ch&&alternates[ch])state.code=state.code.slice(0,-1)+alternates[ch];resetTap();syncCode();return}const group=state.mode===1?latin[key]:state.mode>1?kana[key]:null;if(group){const now=Date.now();if(state.lastKey===key&&now-state.lastAt<1300&&state.code.length){state.letterIndex=(state.letterIndex+1)%group.length;state.code=state.code.slice(0,-1)+(state.mode===3?toKatakana(group[state.letterIndex]):group[state.letterIndex])}else{state.letterIndex=0;state.code+=(state.mode===3?toKatakana(group[0]):group[0])}state.lastKey=key;state.lastAt=now}else if(state.code.length<28){state.code+=(state.mode===1&&key==='0'?' ':key);resetTap()}syncCode()}
function cycleMode(){if(!state.open)return;if(state.unlocked&&!(state.app==='home'&&state.searchMode!=='idle'))return;state.mode=(state.mode+1)%modes.length;resetTap();resetSearchTap();if(state.unlocked){showSearchStatus('輸入模式：'+modes[state.mode]);return}syncCode('輸入模式已切換：'+modes[state.mode]);footer('清除',modes[state.mode],'關蓋')}
function moveSelection(delta){navigateScreen(delta<0?'up':'down')}
$('cover').addEventListener('click',openPhone);$('okBtn').addEventListener('click',unlock);$('softLeft').addEventListener('click',back);$('softRight').addEventListener('click',closePhone);
$('menuBtn').addEventListener('click',()=>{if(state.unlocked)openGuide()});$('messageBtn').addEventListener('click',()=>{if(state.unlocked)openApp('memo')});$('photoBtn').addEventListener('click',()=>{if(state.unlocked)openApp('photos')});$('modeBtn').addEventListener('click',cycleMode);$('clearBtn').addEventListener('click',back);
$('powerBtn').addEventListener('click',()=>{if(state.unlocked)lockPhone();else closePhone()});$('callBtn').addEventListener('click',()=>{if(state.unlocked)renderHome();else syncCode('請按中央圓形鍵解鎖')});
$('upBtn').addEventListener('click',()=>navigateScreen('up'));$('downBtn').addEventListener('click',()=>navigateScreen('down'));$('leftBtn').addEventListener('click',()=>navigateScreen('left'));$('rightBtn').addEventListener('click',()=>navigateScreen('right'));
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>keyPress(b.dataset.key)));
document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{if(state.unlocked)openApp(b.dataset.speed)}));
screen.addEventListener('pointerdown',e=>{const btn=e.target.closest('button');if(btn&&screen.contains(btn))selectNav(btn)});
// V18: touch-scroll for app/photo pages inside the 3D flip transform.
// Tap stays a tap. A vertical drag manually scrolls the display and allows
// reaching the description and "設為桌布" button on actual phones.
let touchScrollLastY=null;
let touchScrollStartY=null;
let touchScrollStartX=null;
let touchScrollDragging=false;
content.addEventListener('touchstart',(event)=>{
 if(!state.open||!state.unlocked||state.app==='home'||event.touches.length!==1){
  touchScrollLastY=null;return;
 }
 const touch=event.touches[0];
 touchScrollLastY=touch.clientY;
 touchScrollStartY=touch.clientY;
 touchScrollStartX=touch.clientX;
 touchScrollDragging=false;
},{passive:true});
content.addEventListener('touchmove',(event)=>{
 if(touchScrollLastY===null||event.touches.length!==1)return;
 const touch=event.touches[0];
 const totalY=touch.clientY-touchScrollStartY;
 const totalX=touch.clientX-touchScrollStartX;
 if(!touchScrollDragging){
  if(Math.abs(totalY)<6||Math.abs(totalY)<Math.abs(totalX))return;
  touchScrollDragging=true;
 }
 if(event.cancelable)event.preventDefault();
 const dy=touch.clientY-touchScrollLastY;
 content.scrollTop-=dy;
 touchScrollLastY=touch.clientY;
},{passive:false});
function stopTouchScroll(){touchScrollLastY=null;touchScrollStartY=null;touchScrollStartX=null;touchScrollDragging=false}
content.addEventListener('touchend',stopTouchScroll,{passive:true});
content.addEventListener('touchcancel',stopTouchScroll,{passive:true});


document.addEventListener('keydown',e=>{if(!state.open||e.ctrlKey||e.metaKey||e.altKey)return;const isTyping=e.target instanceof HTMLInputElement&&(e.target.id==='passwordInput'||e.target.id==='searchInput');if(e.key.startsWith('Arrow')){if(isTyping&&e.target.id==='searchInput'&&state.searchMode==='keyboard'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;e.preventDefault();navigateScreen(e.key.slice(5).toLowerCase());return}if(e.key==='Enter'){if(!e.isComposing){e.preventDefault();if(state.unlocked&&state.app==='home'&&state.searchQuery.trim())submitSearch();else unlock()}return}if(e.key==='Escape'){e.preventDefault();if(state.unlocked)back();else closePhone();return}if(e.key==='Backspace'){if(!isTyping){e.preventDefault();back()}return}if(isTyping)return;if(!state.unlocked&&/^[\p{L}\p{N}*#]$/u.test(e.key))keyPress(e.key)});
$('base').inert=true;$('lid').inert=true;
try{const storedWallpaper=localStorage.getItem(STORE_KEY);if(storedWallpaper)state.wallpaperFile=storedWallpaper}catch(e){}
applyWallpaper(state.wallpaperFile);renderDock();updateClocks();setInterval(updateClocks,30000);
</script>
